name: Desktop release
on:
  workflow_dispatch:
    inputs:
      hip:
        description: Also ship the opt-in ROCm (HIP) bundle in the Linux packages; it needs ROCm 7 on users' machines and only compiles in CI
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  hip:
    # Only when asked (never on a tag push), so a default release's size and time do not change: the Linux hip bundle, built
    # in rocm-compile.yml's container by the same action, for the ubuntu leg below to stage (RIKO_OPTIONAL_BUNDLES).
    if: ${{ inputs.hip }}
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:7.2.1@sha256:42851dac319afce41cf993e25f95005b7f2cd0a0f6abd32ad8f25cd876ec56df
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: ./.github/actions/hip-bundle
        with:
          destination: native-hip/hip
      - name: Pack the hip bundle
        # A tar keeps the versioned library links, which an artifact upload would turn into copies.
        run: tar -C native-hip -cf native-hip.tar hip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: native-hip
          path: native-hip.tar
          if-no-files-found: error
          retention-days: 3
  package:
    needs: hip
    # hip is skipped unless asked, which must not skip the packages; asked for and not built (failed or timed out), it
    # stops only the Linux packages (first step), never Windows or macOS.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple silicon (arm64): it builds the Metal bundle and a DMG (electron/native_backends.json).
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The native CUDA/Vulkan builds and the freeze take hours on hosted runners; the checks that can hang have their own limits.
    timeout-minutes: 300
    env:
      # LunarG's published SHA-256 for each download (https://sdk.lunarg.com/sdk/sha/<version>/<os>/<file>.txt, matching
      # https://vulkan.lunarg.com/sdk/files.json), recorded 2026-10-16: a file that differs is never extracted or run.
      VULKAN_SDK_VERSION: 1.3.296.0
      VULKAN_SDK_LINUX_SHA256: 79b0a1593dadc46180526250836f3e53688a9a5fb42a0e5859eb72316dc4d53e
      VULKAN_SDK_WINDOWS_SHA256: acb4ae0786fd3e558f8b3c36cc3eba91638984217ba8a6795ec64d2f9ffd8c4b
    defaults:
      run:
        # bash -eo pipefail stops a step at its first failing command; Windows' default pwsh checks only the last one.
        shell: bash
    steps:
      - name: Requested HIP bundle was not built
        if: runner.os == 'Linux' && inputs.hip && needs.hip.result != 'success'
        run: echo "::error::The hip job ended '${{ needs.hip.result }}'; the Linux packages are not built without the requested HIP bundle" && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev libportaudio2 libsndfile1 libasound2-dev libfuse2 patchelf
      - name: Linux Vulkan SDK shader compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" --output "$RUNNER_TEMP/vulkan-sdk.tar.xz"
          echo "$VULKAN_SDK_LINUX_SHA256  $RUNNER_TEMP/vulkan-sdk.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vulkan-sdk"
          tar -xJf "$RUNNER_TEMP/vulkan-sdk.tar.xz" -C "$RUNNER_TEMP/vulkan-sdk" --strip-components=1
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan-sdk/x86_64" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vulkan-sdk/x86_64/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/vulkan-sdk/x86_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$RUNNER_TEMP/vulkan-sdk/x86_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$RUNNER_TEMP/vulkan-sdk/x86_64/bin/glslc" --version
      - name: CUDA build toolkit
        if: runner.os != 'macOS'
        uses: Jimver/cuda-toolkit@c35baa1a18fd1fc9dcf47c5bd839bf30559c0bc3  # v0.2.24
        with:
          cuda: '12.4.1'
          method: network
      - name: Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP/vulkan.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/${env:VULKAN_SDK_VERSION}/windows/VulkanSDK-${env:VULKAN_SDK_VERSION}-Installer.exe" -OutFile $installer
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($hash -ne ${env:VULKAN_SDK_WINDOWS_SHA256}) { throw "Vulkan SDK installer SHA-256 $hash is not LunarG's ${env:VULKAN_SDK_WINDOWS_SHA256}" }
          $install = Start-Process $installer -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($install.ExitCode)" }
          "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_SDK_VERSION}" >> $env:GITHUB_ENV
          "C:\VulkanSDK\${env:VULKAN_SDK_VERSION}\Bin" >> $env:GITHUB_PATH
      - name: Python runtime dependencies
        # Exactly the versions in the hash-locked files from tools/release/lock.py; torch is the CPU build. On macOS the lock
        # names the plain PyPI torch wheel, which --require-hashes selects even with the extra index.
        run: |
          python -m pip install --require-hashes -r tools/release/requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes --no-deps -r tools/release/requirements-lock-no-deps.txt
      - name: Frontend dependencies
        working-directory: electron
        run: npm ci
      - name: Frontend tests and build
        # Before the native build, so a JavaScript failure stops the job in minutes rather than after hours.
        timeout-minutes: 20
        working-directory: electron
        run: |
          npm test
          npm run build
      - name: Backend release regression checks
        timeout-minutes: 30
        env:
          RIKO_RELEASE_BUILD: '1'
        run: python -m pytest tests/test_release_build.py tests/test_release_config.py tests/test_llama_native.py tests/test_responses_wire.py tests/test_settings_store.py tests/test_dependency_manifests.py -q --timeout=300
      - name: Opt-in HIP bundle
        if: runner.os == 'Linux' && needs.hip.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: native-hip
          path: ${{ runner.temp }}/native-hip
      - name: Unpack the HIP bundle
        if: runner.os == 'Linux' && needs.hip.result == 'success'
        run: mkdir -p "$RUNNER_TEMP/optional" && tar -C "$RUNNER_TEMP/optional" -xf "$RUNNER_TEMP/native-hip/native-hip.tar"
      - name: Build the native backends and freeze Python
        # CUDA and Vulkan on Windows and Linux, Metal on macOS: the default backends electron/native_backends.json ships for
        # the OS; plus hip on Linux when asked, staged from the hip job and release-checked without ROCm on this runner.
        env:
          RIKO_OPTIONAL_BUNDLES: ${{ runner.os == 'Linux' && needs.hip.result == 'success' && format('{0}/optional', runner.temp) || '' }}
        run: python tools/release/build.py
      - name: Package installers
        timeout-minutes: 60
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Optional macOS signing secrets, given only to the macOS leg. Without them the app is signed ad hoc
          # (electron/build/mac_sign.cjs) and Gatekeeper asks users to approve it in System Settings.
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          MAC_NOTARY_KEY: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_KEY || '' }}
          MAC_NOTARY_KEY_ID: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_KEY_ID || '' }}
          MAC_NOTARY_ISSUER: ${{ runner.os == 'macOS' && secrets.MAC_NOTARY_ISSUER || '' }}
        # The deb target needs a homepage, and electron-builder looks for .git only in electron/. Quoted for pwsh.
        run: |
          # electron-builder reads an empty CSC_LINK as a certificate to import, so these are exported only when set:
          # a Developer ID certificate (base64 .p12), then an App Store Connect API key (.p8 text) to notarize with.
          if [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true
            if [ -n "$MAC_NOTARY_KEY" ]; then
              printf '%s\n' "$MAC_NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8" APPLE_API_KEY_ID="$MAC_NOTARY_KEY_ID" APPLE_API_ISSUER="$MAC_NOTARY_ISSUER"
            fi
          fi
          npx --no-install electron-builder --config electron-builder.yml --publish never "-c.extraMetadata.homepage=${{ github.server_url }}/${{ github.repository }}"
      - name: Release check inside the signed macOS app
        if: runner.os == 'macOS'
        timeout-minutes: 30
        # build.py checked the unsigned stage; this repeats it under the hardened runtime and entitlements users get.
        run: python tools/release/build.py --check-app electron/release/mac-arm64/Riko.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: Riko-${{ runner.os }}-${{ runner.os == 'macOS' && 'arm64' || 'x64' }}${{ runner.os == 'Linux' && needs.hip.result == 'success' && '-hip' || '' }}
          path: |
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.dmg
          if-no-files-found: error
