name: Native smoke
# Builds the patched riko-native bridge at the pinned llama.cpp with Metal, as a release does, and runs a small GGUF through
# InProcessLlamaProvider (tests/test_native_smoke.py): the ctypes ABI, slots, streaming, cancellation and the emotion probe.
# Hosted Apple silicon runners have a paravirtual GPU that llama.cpp's Metal backend can use (PyTorch MPS cannot).
# The opt-in ROCm bundle's compile check lives in rocm-compile.yml (manual: twelve GPU targets take hours).
on:
  push:
    branches: ['**']
    paths:
      - tools/llama_cpp/**
      - Code/process/app_core/inference/**
      - Code/process/app_core/kernel/**   # messages, streaming, cancellation and timings the providers use
      - tools/release/**
      - electron/native_backends.json
      - Code/process/app_core/emotion/**   # FEATURE_VERSION must match tools/llama_cpp/emotion-probe.patch
      - Code/process/app_core/configuration/**
      - Code/run_server.py
      - pyproject.toml
      - tests/test_native_smoke.py
      - .github/workflows/native-smoke.yml
  pull_request:
    paths:  # the same list as push
      - tools/llama_cpp/**
      - Code/process/app_core/inference/**
      - Code/process/app_core/kernel/**   # messages, streaming, cancellation and timings the providers use
      - tools/release/**
      - electron/native_backends.json
      - Code/process/app_core/emotion/**   # FEATURE_VERSION must match tools/llama_cpp/emotion-probe.patch
      - Code/process/app_core/configuration/**
      - Code/run_server.py
      - pyproject.toml
      - tests/test_native_smoke.py
      - .github/workflows/native-smoke.yml
  schedule:
    - cron: '23 5 * * 1'  # weekly (Monday 05:23 UTC): runner images, Xcode and macOS change without a commit here
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}  # a push and its pull request share one run
  cancel-in-progress: true
jobs:
  metal:
    name: Metal bridge and model (macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_OFFLINE: '1'
      LLAMA_CPP: ${{ github.workspace }}/.native/llama.cpp-smoke
      # Qwen2.5-0.5B-Instruct, Apache-2.0 (LICENSE in the repository at this revision), from Qwen's own GGUF repository.
      MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf
      MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db
      MODEL: ${{ github.workspace }}/.native/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/release/requirements-lock*.txt
      - name: Pinned llama.cpp commit
        id: pin
        run: echo "commit=$(python -c "import runpy; print(runpy.run_path('tools/release/build.py')['PIN'])")" >> "$GITHUB_OUTPUT"
      - name: Restore the llama.cpp checkout
        id: llama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .native/llama.cpp-smoke
          key: llama.cpp-${{ steps.pin.outputs.commit }}
      - name: Fetch llama.cpp at the pin
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          git init -q "$LLAMA_CPP"
          git -C "$LLAMA_CPP" remote add origin https://github.com/ggml-org/llama.cpp
          git -C "$LLAMA_CPP" fetch --depth 1 origin "${{ steps.pin.outputs.commit }}"
          git -C "$LLAMA_CPP" -c core.autocrlf=false checkout -q --detach FETCH_HEAD
      - name: Cache the unpatched checkout
        # Saved before the patch and the build, so every run patches the pin afresh; build.py refuses any other commit.
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .native/llama.cpp-smoke
          key: llama.cpp-${{ steps.pin.outputs.commit }}
      - name: Build the Metal bundle
        # The release's patch, CMake flags (@loader_path rpath, embedded Metal library) and library copying.
        run: python tools/release/build.py --smoke-bundle metal "$LLAMA_CPP" "$RUNNER_TEMP/native/metal"
      - name: Restore the model
        id: model-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .native/models
          key: gguf-${{ env.MODEL_SHA256 }}
      - name: Download the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$MODEL")"
          curl --fail --location --retry 3 --output "$MODEL" "$MODEL_URL"
      - name: Verify the model
        run: echo "$MODEL_SHA256  $MODEL" | shasum -a 256 -c -
      - name: Cache the model
        # Once verified, and whether or not the tests below pass.
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .native/models
          key: gguf-${{ env.MODEL_SHA256 }}
      - name: Python dependencies
        run: |
          python -m pip install --require-hashes -r tools/release/requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install --require-hashes --no-deps -r tools/release/requirements-lock-no-deps.txt
      - name: Native tests
        env:
          RIKO_TEST_NATIVE_LIBRARY: ${{ runner.temp }}/native/metal/libriko-native.dylib
          RIKO_TEST_GGUF: ${{ env.MODEL }}
          RIKO_TEST_EXPECT_GPU: '1'
          RIKO_TEST_EXPECT_DEVICES: '1'   # the bridge built here has riko_devices
        run: python -m pytest -m native -v -rs --timeout=600 tests/test_native_smoke.py
