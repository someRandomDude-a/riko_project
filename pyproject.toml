[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riko-companion"
version = "0.1.0"
description = "Local voice and companion runtime"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "ruamel.yaml>=0.18", "openai>=1.0"]

[project.optional-dependencies]
llama = ["huggingface_hub", "httpx"]
desktop = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=12", "pillow>=10"]
discord = ["discord.py>=2.7.1,<3", "python-dotenv>=1.0", "aiohttp>=3.9", "pypdf>=4"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["Code"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["Code"]
